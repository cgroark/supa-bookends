<button type="button" class="cover" [class.cover--compact]="compact"
  [class.cover--fallback]="!imageUrl || imageFailed"
  [attr.aria-label]="'Open ' + title + (author ? ' by ' + author : '')"
  [title]="title + (author ? ' — ' + author : '')" (click)="opened.emit()">
  @if(imageUrl && !imageFailed) {
    <img [src]="imageUrl" [alt]="'Cover of ' + title" (error)="imageFailed = true">
  } @else {
    <svg class="cover__icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M7 5h17a2 2 0 0 1 2 2v20H9a4 4 0 0 1-4-4V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 5v17m-5 1a3 3 0 0 1 3-3h18M14 10h8m-8 4h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <span class="cover__title">{{ title }}</span>
    @if(author) { <span class="cover__author">{{ author }}</span> }
  }
</button>
