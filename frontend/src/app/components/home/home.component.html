<header class="py-5">
  <h1>Book Ends</h1>
  <p>
    <i class="bi bi-book-half me-1"></i>
    Track what you read
    <i class="bi bi-file-earmark-person mx-1"></i>
    See your friends books</p>
</header>
<div class="row">
  <div class="col-md-8">
    <h2>You're Reading</h2>
    @for(book of currentBooks; track book.id) {
      <div>
        <img [src]="book.image_url" [alt]="'book cover of '+ book.title">
      </div>
    }
    <h2>You last read</h2>
    @for(book of recentBooks; track book.id; let index = $index) {
      @if(index < 4) {
        <div>
          <img [src]="book.image_url" [alt]="'book cover of '+ book.title">
        </div>
      }
    }
    <button
    class="btn btn-primary"
    (click)="onOpen(content)"
  >
    Add a book<i class="bi-book ms-2"></i>
  </button>
    <h2>Recent Reads</h2>
  </div>
  <div class="col-md-4">
    <h2>best sellers</h2>
    <app-bestsellers />
  </div>
</div>

<ng-template
  #content
  let-modal
>
  <div class="modal-header">
    <h4
      class="modal-title"
      id="modal-basic-title"
    >
      <i class="bi bi-search me-2"></i>
      <ng-container>Add to your library</ng-container>
    </h4>
    <button
      class="btn ms-auto"
      (click)="modal.dismiss('Cross click')"
      type="button"
      aria-label="Close"
    >
    <i class="bi bi-x-square-fill"></i>
  </button>
  </div>
  <div class="modal-body">
    <div>
      <app-book-form />
    </div>
  </div>
</ng-template>
