<h1>Book Ends</h1>
<div class="row">
  <div class="col-md-3 order-md-last">
    <h2>You're Reading</h2>
    <button
    class="btn btn-primary"
    (click)="onOpen(content)"
  >
    Add a book<i class="bi-book ms-2"></i>
  </button>
  </div>
  <div class="col-md-5">
    <h2>Recent Reads</h2>
  </div>
  <div class="col-md-4 order-md-first">
    <h2>best sellers</h2>
    <app-bestsellers />
  </div>
</div>

<ng-template
  #content
  let-modal
>
  <div class="modal-header">
    <h4
      class="modal-title"
      id="modal-basic-title"
    >
      <i class="bi-send me-1"></i>
      <ng-container>Find and Add a Book</ng-container>
    </h4>
    <button
      class="btn-close"
      (click)="modal.dismiss('Cross click')"
      type="button"
      aria-label="Close"
    ></button>
  </div>
  <div class="modal-body">
    <div>
      <app-book-form />
    </div>
  </div>
</ng-template>
