<button class="site-nav__link site-nav__signout" type="button" (click)="onOpenModal(content)">
  <i class="bi bi-box-arrow-right" aria-hidden="true"></i><span>Sign out</span>
</button>

<ng-template
  #content
  let-modal
>
<div class="modal-header">
  <h4
    class="modal-title"
    id="modal-basic-title"
  >
    <i class="bi bi-emoji-dizzy me-2"></i>
    Sure you want to logout?
  </h4>
  <button
    class="btn ms-auto"
    (click)="modal.dismiss('Cross click')"
    type="button"
    aria-label="Close"
  >
  <i class="bi bi-x-square-fill"></i>
</button>
</div>
  <div class="modal-body modal-confirmation">
    <div>
      <div class="modal-actions">
        <button
          class="btn main-purple-button"
          (click)="modal.dismiss('Cross click')"
        >
          Cancel
          <i class="bi bi-x-lg ms-1"></i>
        </button>
        <button
          class="btn main-red-button"
          (click)="logout()"
          >
          Sign Out
          <i class="bi bi-emoji-dizzy ms-1"></i>
        </button>
      </div>
    </div>
  </div>
</ng-template>
