<app-header />
<app-navbar />
<h2>
  <i class="bi bi-person-add me-1"></i>
  Find and Add Connections
</h2>
<div class="py-4 px-3 search-section rounded mb-4">
  <ng-select
    [items]="connections$ | async"
    [typeahead]="connectionInput$"
    [loading]="isLoading"
    loadingText="Searching..."
    [(ngModel)]="selectedConnection"
    (change)="onChange($event)"
    placeholder="Search connections by name..."
  >
  <ng-template
    ng-label-tmp
    let-item="item"
    >
    <div class="d-flex align-items-center gap-1">
      <span>{{ item.first }}</span> <span>{{ item.last }}</span>
    </div>
    </ng-template>
    <ng-template
      ng-option-tmp
      let-item="item"
      let-search="searchTerm"
      >
      <div class="d-flex align-items-center gap-1">
        <span [ngOptionHighlight]="search">{{ item.first }} {{ item.last }}</span>
        <button
          class="btn main-teal-button px-2 py-0 ms-2"
          (click)="addConnection(item.id)"
          >
          Add {{ item.first }}
          <i class="bi bi-person-add ms-1"></i>
        </button>
      </div>
    </ng-template>
  </ng-select>
</div>
@if(isAdding) {
  <span class="spinner-border" role="status">
  </span>
}

@if(existingConnections.length) {
  <section>
    <h2>
      <i class="bi bi-people-fill me-1"></i>
      Your Connections
    </h2>
    @if(isLoadingConnections) {
      <span class="spinner-border" role="status">
      </span>
    } @else {
      @for(each of existingConnections; track each) {
        {{each.first}}
      }
    }
  </section>
}
